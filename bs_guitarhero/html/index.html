<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rhythm Highway HUD</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="root" class="hidden">
  <div class="stage" id="stage">
    <div class="hud" id="hud">

      <!-- ===================== bara de sus ===================== -->
      <div class="topbar">

        <div class="chips">
          <div class="chip chip-meter" id="meterChip">
            <span class="chip-dot" id="meterDot"></span>
            <span class="chip-label">ROCK METER</span>
            <div class="chip-bar"><div class="chip-bar-fill" id="meterFill"></div></div>
            <span class="chip-val" id="meterVal">65%</span>
          </div>
          <div class="chip chip-rate hidden" id="rateChip">
            <span class="chip-dot rate-dot"></span>
            <span class="chip-label" id="rateText">x1.00 SPEED</span>
          </div>
        </div>

        <div class="trackline">
          <div class="trackline-row">
            <span class="track-label" id="trackLabel">ICH WILL &middot; RAMMSTEIN</span>
            <span class="track-time" id="timeText">0:00 / 0:00</span>
          </div>
          <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat-k">SCORE</span>
            <span class="stat-v" id="scoreText">00000</span>
          </div>
          <div class="stat">
            <span class="stat-k">ACC</span>
            <span class="stat-v stat-accent" id="accText">100.0%</span>
          </div>
        </div>
      </div>

      <!-- ===================== combo / judecata ===================== -->
      <div class="comborow">
        <div class="combo-box" id="comboBox">
          <span class="combo-k">COMBO</span>
          <span class="combo-v" id="comboText">x0</span>
        </div>
        <div class="judge" id="judge"></div>
      </div>

      <!-- ===================== autostrada ===================== -->
      <div class="highway" id="highway">
        <div class="plane">
          <div class="beats-clip">
            <div class="beats" id="beats"></div>
          </div>
          <div class="lanes">
            <div class="lane l0"><i class="string"></i></div>
            <div class="lane l1"><i class="string"></i></div>
            <div class="lane l2"><i class="string"></i></div>
            <div class="lane l3"><i class="string"></i></div>
          </div>
          <div class="notes" id="notes"></div>
        </div>
      </div>

      <!-- ===================== linia de lovire + receptori ===================== -->
      <div class="hitzone">
        <div class="hitline"></div>
        <div class="recs" id="recs"></div>
        <div class="keynames">
          <span>LEFT</span><span>DOWN</span><span>UP</span><span>RIGHT</span>
        </div>
        <div class="hints" id="hints">
          <span><b>ESC</b> iesi</span>
          <span><b>P</b> pauza</span>
          <span><b>[ ]</b> calibrare <em id="offsetText">0 ms</em></span>
          <span><b>- +</b> volum <em id="volText">55%</em></span>
        </div>
      </div>

      <!-- ===================== overlay ===================== -->
      <div class="overlay hidden" id="overlay">
        <div class="ov-kicker" id="ovKicker">READY</div>
        <div class="ov-title" id="ovTitle">ICH WILL</div>
        <div class="ov-sub" id="ovSub"></div>
      </div>

    </div>
  </div>
</div>

<audio id="track" preload="auto"></audio>
<script src="js/game.js"></script>
</body>
</html>
